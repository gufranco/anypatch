name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  commits:
    name: Commit subjects
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every new commit follows the convention the release reads
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ${EVENT} == pull_request ]]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [[ -z ${BEFORE} || ${BEFORE} == 0000000000000000000000000000000000000000 ]]; then
            range="${AFTER}~1..${AFTER}"
          elif git merge-base --is-ancestor "${BEFORE}" "${AFTER}" 2>/dev/null; then
            range="${BEFORE}..${AFTER}"
          else
            range="${AFTER}~1..${AFTER}"
          fi
          bash scripts/check-commits.sh --range "${range}"

  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --frozen --python "${PYTHON_VERSION}"

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

      - name: Lint the shell scripts and hooks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint
          shellcheck --severity=style --shell=bash scripts/*.sh .githooks/*
          yamllint -c .yamllint.yml .github

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Every JSON and YAML file is formatted
        run: pnpm run format:check

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --frozen --python "${PYTHON_VERSION}"

      - name: Every annotation has to hold
        run: uv run mypy

  test:
    name: ${{ matrix.label }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, python: "3.11", label: Linux x86_64 }
          - { os: ubuntu-26.04, python: "3.12", label: Linux x86_64 }
          - { os: ubuntu-26.04, python: "3.13", label: Linux x86_64 }
          - { os: ubuntu-26.04, python: "3.14", label: Linux x86_64 }
          - { os: ubuntu-24.04-arm, python: "3.14", label: Linux arm64 }
          - { os: macos-15-intel, python: "3.14", label: macOS Intel }
          - { os: macos-latest, python: "3.14", label: macOS Apple silicon }
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --frozen --python "${{ matrix.python }}"

      - name: The suite, against nothing but the repository
        run: uv run pytest -q -p no:randomly

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --frozen --python "${PYTHON_VERSION}"

      - name: Coverage clears the gate in pyproject.toml
        run: uv run pytest -q -p no:randomly --cov --cov-report=term-missing

  library:
    name: The library needs nothing outside the standard library
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install it without the cli extra
        run: |
          python -m venv .bare
          .bare/bin/pip install --quiet --disable-pip-version-check .

      - name: The library imports and runs, and the command says how to get the cli extra
        run: |
          set -euo pipefail
          .bare/bin/python -c "from anypatch import doctor; assert doctor.diagnose().healthy"
          if .bare/bin/python -c "import typer" 2>/dev/null; then
            echo "::error title=Typer leaked::the library install pulled in typer"
            exit 1
          fi
          set +e
          message=$(.bare/bin/anypatch doctor 2>&1)
          code=$?
          set -e
          echo "${message}"
          if [[ ${code} != 1 || ${message} != *"cli extra"* ]]; then
            echo "::error title=No hint::without the extra the command must exit 1 and name the extra"
            exit 1
          fi

  installed:
    name: Installed on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, label: Linux x86_64 }
          - { os: ubuntu-24.04-arm, label: Linux arm64 }
          - { os: macos-15-intel, label: macOS Intel }
          - { os: macos-latest, label: macOS Apple silicon }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install it the way a user would, with the command line
        run: python -m pip install --disable-pip-version-check ".[cli]"

      - name: The command line runs and the installation is healthy
        run: |
          anypatch --version
          anypatch doctor
          anypatch doctor --json

  formula:
    name: Homebrew formula
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Style
        run: brew style Formula/anypatch.rb

      - name: Install it from a tarball built out of git, and run its test
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          git archive --format=tar.gz --prefix=anypatch/ -o "${work}/src.tar.gz" HEAD
          checksum=$(shasum -a 256 "${work}/src.tar.gz" | awk '{print $1}')
          brew tap-new gufranco/anypatch-ci --no-git
          tap=$(brew --repository gufranco/anypatch-ci)
          mkdir -p "${tap}/Formula"
          python3 - "${work}" "${checksum}" "${tap}/Formula/anypatch.rb" <<'PATCH'
          import re
          import sys
          from pathlib import Path

          work, checksum, target = sys.argv[1], sys.argv[2], Path(sys.argv[3])
          text = Path("Formula/anypatch.rb").read_text()
          text = re.sub(r'url "[^"]+"', f'url "file://{work}/src.tar.gz"', text, count=1)
          text = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{checksum}"', text, count=1)
          version = Path("src/anypatch/version.py").read_text().split('"')[1]
          text = text.replace('  license "MIT"', f'  version "{version}"\n  license "MIT"', 1)
          target.write_text(text)
          PATCH
          brew install --build-from-source gufranco/anypatch-ci/anypatch
          brew test gufranco/anypatch-ci/anypatch

  distribution:
    name: The wheel carries the library and nothing else
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build it
        run: uv build --wheel

      - name: No test or test support file ships
        run: |
          python3 - <<'CHECK'
          import sys
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          shipped = [name for name in names if name.endswith(("_test.py", "_test_support.py", "conftest.py"))]
          print(f"{len(names)} files in {wheel.name}")
          if shipped:
              print(f"::error title=Tests in the wheel::{', '.join(shipped)}")
              sys.exit(1)
          CHECK

  xdelta:
    name: xdelta3 and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the reference tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdelta3

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool xdelta3 --work "$RUNNER_TEMP/interop"

  bsdiff43:
    name: mendsley bsdiff and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    env:
      MENDSLEY_COMMIT: b817e9491cf7b8699c8462ef9e2657ca4ccd7667
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the reference tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libbz2-dev
          git clone --quiet --filter=blob:none https://github.com/mendsley/bsdiff.git "$RUNNER_TEMP/mendsley"
          git -C "$RUNNER_TEMP/mendsley" checkout --quiet "$MENDSLEY_COMMIT"
          mkdir -p "$RUNNER_TEMP/bin"
          cc -O2 -DBSDIFF_EXECUTABLE -o "$RUNNER_TEMP/bin/bsdiff43" "$RUNNER_TEMP/mendsley/bsdiff.c" -lbz2
          cc -O2 -DBSPATCH_EXECUTABLE -o "$RUNNER_TEMP/bin/bspatch43" "$RUNNER_TEMP/mendsley/bspatch.c" -lbz2
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool bsdiff43 --work "$RUNNER_TEMP/interop"

  flips:
    name: Flips and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    env:
      FLIPS_COMMIT: ff216a75df0987047a67d7923567dc4482ce07ac
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the reference tool
        run: |
          git clone --quiet --filter=blob:none https://github.com/Alcaro/Flips.git "$RUNNER_TEMP/flips"
          git -C "$RUNNER_TEMP/flips" checkout --quiet "$FLIPS_COMMIT"
          (cd "$RUNNER_TEMP/flips" && TARGET=cli make)
          echo "$RUNNER_TEMP/flips" >> "$GITHUB_PATH"

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool flips --work "$RUNNER_TEMP/interop"

  ppf:
    name: ApplyPPF, MakePPF and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    env:
      MULTIPATCH_COMMIT: b047dd325f5d37fd3cc920433080e27af779cf47
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the reference tools
        run: |
          git clone --quiet --filter=blob:none https://github.com/sappharad/MultiPatch.git "$RUNNER_TEMP/multipatch"
          git -C "$RUNNER_TEMP/multipatch" checkout --quiet "$MULTIPATCH_COMMIT"
          ppf="$RUNNER_TEMP/multipatch/ppfdev"
          printf '#include <stdio.h>\nFILE *ppf, *bin;\n' > "$RUNNER_TEMP/globals.c"
          mkdir -p "$RUNNER_TEMP/bin"
          cc -O2 -D_LARGEFILE64_SOURCE -D_FILE_OFFSET_BITS=64 -Dapplyppf3_main=main \
            -o "$RUNNER_TEMP/bin/applyppf3" "$ppf/applyppf3_linux.c"
          cc -O2 -D_LARGEFILE64_SOURCE -D_FILE_OFFSET_BITS=64 -Dmakeppf3_main=main \
            -o "$RUNNER_TEMP/bin/makeppf3" "$ppf/makeppf3_linux.c" "$RUNNER_TEMP/globals.c"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool makeppf3 --tool applyppf3 --work "$RUNNER_TEMP/interop"

  bsdiff4:
    name: bsdiff4 and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the reference tool
        run: python -m pip install --disable-pip-version-check bsdiff4==1.3.0

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool bsdiff4 --work "$RUNNER_TEMP/interop"

  open-vcdiff:
    name: open-vcdiff and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    env:
      OPEN_VCDIFF_COMMIT: 868f459a8d815125c2457f8c74b12493853100f9
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the reference tool
        run: |
          git clone --quiet https://github.com/google/open-vcdiff.git "$RUNNER_TEMP/ovc"
          git -C "$RUNNER_TEMP/ovc" checkout --quiet "$OPEN_VCDIFF_COMMIT"
          git -C "$RUNNER_TEMP/ovc" submodule update --quiet --init
          cmake -S "$RUNNER_TEMP/ovc" -B "$RUNNER_TEMP/ovc-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -Dvcdiff_build_tests=OFF
          cmake --build "$RUNNER_TEMP/ovc-build" --target vcdiff -j 4
          echo "$RUNNER_TEMP/ovc-build" >> "$GITHUB_PATH"

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool open-vcdiff --work "$RUNNER_TEMP/interop"

  hdiffpatch:
    name: HDiffPatch and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    env:
      HDIFFPATCH_COMMIT: 3b9dca715ca492873bf2c49e22e5d5b7d2a78620
      LZMA_COMMIT: 44809544b95bbf2dccec75d954657ff76fc349ff
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the reference tools
        run: |
          cd "$RUNNER_TEMP"
          git clone --quiet --filter=blob:none https://github.com/sisong/HDiffPatch.git
          git -C HDiffPatch checkout --quiet "$HDIFFPATCH_COMMIT"
          git clone --quiet --filter=blob:none https://github.com/sisong/lzma.git
          git -C lzma checkout --quiet "$LZMA_COMMIT"
          git clone --quiet --depth=1 --branch v1.3.1 https://github.com/madler/zlib.git
          git clone --quiet --depth=1 --branch bzip2-1.0.8 https://gitlab.com/bzip2/bzip2.git
          make -C HDiffPatch -j 4 ZSTD=0 LDEF=0 XXH=0 VCD=0 BSD=0 MT=0 DIR_DIFF=0 hdiffz hpatchz
          echo "$RUNNER_TEMP/HDiffPatch" >> "$GITHUB_PATH"

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool hdiffpatch --work "$RUNNER_TEMP/interop"

  vpatch:
    name: NSIS VPatch and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    env:
      NSIS_COMMIT: f0bfe3e0062c57dc1ef90f1d235c7c0bd5a43be4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the reference tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev
          cd "$RUNNER_TEMP"
          git clone --quiet --filter=blob:none --sparse https://github.com/kichik/nsis.git
          git -C nsis sparse-checkout set Contrib/VPatch/Source
          git -C nsis checkout --quiet "$NSIS_COMMIT"
          mkdir -p bin
          source="$RUNNER_TEMP/nsis/Contrib/VPatch/Source"
          cc -O2 -c "$source/GenPat/md5.c" -o md5.o
          c++ -O2 -std=c++11 -o bin/genpat "$source"/GenPat/*.cpp md5.o -lz
          cc -O2 -std=c99 -Wall -Wno-unused-function -I"$GITHUB_WORKSPACE/scripts/vpatch" \
            -I"$source/Plugin" -o bin/vpatch-apply "$GITHUB_WORKSPACE/scripts/vpatch/main.c" \
            "$source/Plugin/apply_patch.c" "$source/Plugin/checksum.c" "$source/Plugin/md5.c"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool vpatch --work "$RUNNER_TEMP/interop"

  jojodiff:
    name: JojoDiff and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    env:
      JOJODIFF_COMMIT: 66a2806de9de417d5aff013e13d9af3267ed45a1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the reference tool
        run: |
          cd "$RUNNER_TEMP"
          git clone --quiet https://git.code.sf.net/p/jojodiff/code jojodiff
          git -C jojodiff checkout --quiet "$JOJODIFF_COMMIT"
          mkdir -p bin
          c++ -O2 -w -fsigned-char -o bin/jdiff jojodiff/jdiff/src/*.cpp
          ln -s jdiff bin/jpatch
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool jojodiff --work "$RUNNER_TEMP/interop"

  dldi:
    name: dlditool and anypatch patch every generated DLDI case alike
    runs-on: ubuntu-26.04
    env:
      BLOCKSDS_COMMIT: 71c9bf7eaf9ae8aa89834a9674d2937956fb8b0e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the reference tool
        run: |
          cd "$RUNNER_TEMP"
          git clone --quiet --filter=blob:none --sparse https://github.com/blocksds/sdk.git blocksds
          git -C blocksds sparse-checkout set tools/dlditool
          git -C blocksds checkout --quiet "$BLOCKSDS_COMMIT"
          mkdir -p bin
          cc -O2 -std=gnu99 -DVERSION_STRING='"blocksds"' -o bin/dlditool blocksds/tools/dlditool/dlditool.c
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Patch every generated case with dlditool and anypatch
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool dlditool --work "$RUNNER_TEMP/interop"

  xdelta1:
    name: xdelta 1.1 and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    env:
      XDELTA1_COMMIT: 346b70280c8234a327a761e52610355628427341
      XDELTA1_SHA256: a0e043e60c7c7b002c0b628748eea82e877a5d429de1044a2213464d1dd24bac
      XDELTA1_SNAPSHOT: https://git.tizen.org/cgit/platform/upstream/xdelta1/snapshot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the reference tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-dev zlib1g-dev
          cd "$RUNNER_TEMP"
          curl -sfL -o xdelta1.tar.gz "$XDELTA1_SNAPSHOT/xdelta1-$XDELTA1_COMMIT.tar.gz"
          echo "$XDELTA1_SHA256  xdelta1.tar.gz" | sha256sum -c -
          mkdir -p bin config xdelta1
          tar -xzf xdelta1.tar.gz -C xdelta1 --strip-components=1
          {
            echo "#define HAVE_GETTIMEOFDAY 1"
            echo "#define TIME_WITH_SYS_TIME 1"
            echo "#define STDC_HEADERS 1"
            echo '#define VERSION "1.1.4"'
            echo '#define PACKAGE "xdelta"'
          } > config/config.h
          cd xdelta1
          # shellcheck disable=SC2046
          cc -O1 -w -std=gnu89 -DHAVE_CONFIG_H -I"$RUNNER_TEMP/config" -I. -Ilibedsio \
            $(pkg-config --cflags glib-2.0) -o "$RUNNER_TEMP/bin/xdelta1" \
            xdmain.c xdelta.c xdapply.c xd_edsio.c getopt.c getopt1.c \
            libedsio/{base64,default,edsio,edsio_edsio,fh,generic,library}.c \
            libedsio/{maketime,md5c,partime,sha,simple}.c \
            $(pkg-config --libs glib-2.0) -lz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
        run: python scripts/interop.py --tool xdelta1 --work "$RUNNER_TEMP/interop"

  bsp:
    name: bsppatch.js applies every boundary BSP anypatch writes
    runs-on: ubuntu-26.04
    env:
      BSP_COMMIT: 1553f2e8a4056ef30066f812b0f568163e17e8bf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch the reference engine
        run: |
          git clone --quiet https://github.com/aaaaaa123456789/bsp.git "$RUNNER_TEMP/bsp"
          git -C "$RUNNER_TEMP/bsp" checkout --quiet "$BSP_COMMIT"

      - name: Apply the boundary patches with bsppatch.js
        env:
          PYTHONPATH: src
          BSP_HARNESS: ${{ github.workspace }}/scripts/bsp/harness.js
          BSPPATCH: ${{ runner.temp }}/bsp/bsppatch.js
        run: python scripts/interop.py --tool bsppatch --work "$RUNNER_TEMP/interop"

  igir:
    name: igir applies every boundary patch anypatch writes
    runs-on: ubuntu-26.04
    env:
      IGIR_VERSION: 5.7.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the reference tool
        run: npm install --prefix "$RUNNER_TEMP/igir" --no-audit --no-fund --ignore-scripts "igir@$IGIR_VERSION"

      - name: Apply the boundary patches with igir
        env:
          PYTHONPATH: src
          IGIR: ${{ runner.temp }}/igir/node_modules/igir
        run: python scripts/interop.py --tool igir --work "$RUNNER_TEMP/interop"

  gdiff:
    name: javaxdelta and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    env:
      JAVAXDELTA_SHA256: a661dfcb749053fc26eada2a0a8e619a8ead1ca9eda29e1698687aa2cdd80152
      TROVE_SHA256: ad68a86cfd0255a2bc0525ce11ec49640caea7e34ff91eb89c3193dcccd77f05
      JAVAXDELTA_URL: https://repo1.maven.org/maven2/com/nothome/javaxdelta/2.0.1/javaxdelta-2.0.1.jar
      TROVE_URL: https://repo1.maven.org/maven2/trove/trove/1.0.2/trove-1.0.2.jar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the reference tool
        run: |
          curl -sfL -o "$RUNNER_TEMP/javaxdelta.jar" "$JAVAXDELTA_URL"
          curl -sfL -o "$RUNNER_TEMP/trove.jar" "$TROVE_URL"
          echo "${JAVAXDELTA_SHA256}  $RUNNER_TEMP/javaxdelta.jar" | sha256sum -c -
          echo "${TROVE_SHA256}  $RUNNER_TEMP/trove.jar" | sha256sum -c -

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
          JAVAXDELTA: ${{ runner.temp }}/javaxdelta.jar:${{ runner.temp }}/trove.jar
        run: python scripts/interop.py --tool javaxdelta --work "$RUNNER_TEMP/interop"

  romjs:
    name: RomPatcher.js, bsdiff and anypatch exchange every boundary patch
    runs-on: ubuntu-26.04
    env:
      ROMJS_COMMIT: 3183884086825c3a57c72026234debcef1e2240c
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the reference tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bsdiff
          git clone --quiet --filter=blob:none https://github.com/marcrobledo/RomPatcher.js.git "$RUNNER_TEMP/romjs"
          git -C "$RUNNER_TEMP/romjs" checkout --quiet "$ROMJS_COMMIT"

      - name: Write the RomPatcher.js harness
        run: |
          cat > "$RUNNER_TEMP/romjs.js" <<'HARNESS'
          const fs = require('fs');
          const RomPatcher = require(process.env.ROMJS + '/rom-patcher-js/RomPatcher.js');
          const [cmd, a, b, c, d] = process.argv.slice(2);
          const save = (file, path) => fs.writeFileSync(path, Buffer.from(file._u8array.subarray(0, file.fileSize)));
          if (cmd === 'apply') {
            const patch = RomPatcher.parsePatchFile(new BinFile(b));
            if (!patch) { throw new Error('unknown patch'); }
            save(RomPatcher.applyPatch(new BinFile(a), patch, { requireValidation: true }), c);
          } else {
            save(RomPatcher.createPatch(new BinFile(a), new BinFile(b), c).export(), d);
          }
          HARNESS

      - name: Exchange the boundary files in both directions
        env:
          PYTHONPATH: src
          ROMJS: ${{ runner.temp }}/romjs
          ROMJS_HARNESS: ${{ runner.temp }}/romjs.js
        run: python scripts/interop.py --tool romjs --tool bsdiff --work "$RUNNER_TEMP/interop"
