name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  commits:
    name: Commit subjects
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every new commit follows the convention the release reads
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ${EVENT} == pull_request ]]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [[ -z ${BEFORE} || ${BEFORE} == 0000000000000000000000000000000000000000 ]]; then
            range="${AFTER}~1..${AFTER}"
          elif git merge-base --is-ancestor "${BEFORE}" "${AFTER}" 2>/dev/null; then
            range="${BEFORE}..${AFTER}"
          else
            range="${AFTER}~1..${AFTER}"
          fi
          bash scripts/check-commits.sh --range "${range}"

  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --frozen --python "${PYTHON_VERSION}"

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

      - name: Lint the shell scripts and hooks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint
          shellcheck --severity=style --shell=bash scripts/*.sh .githooks/*
          yamllint -c .yamllint.yml .github

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Every JSON and YAML file is formatted
        run: pnpm run format:check

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --frozen --python "${PYTHON_VERSION}"

      - name: Every annotation has to hold
        run: uv run mypy

  test:
    name: ${{ matrix.label }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, python: "3.11", label: Linux x86_64 }
          - { os: ubuntu-26.04, python: "3.12", label: Linux x86_64 }
          - { os: ubuntu-26.04, python: "3.13", label: Linux x86_64 }
          - { os: ubuntu-26.04, python: "3.14", label: Linux x86_64 }
          - { os: ubuntu-24.04-arm, python: "3.14", label: Linux arm64 }
          - { os: macos-15-intel, python: "3.14", label: macOS Intel }
          - { os: macos-latest, python: "3.14", label: macOS Apple silicon }
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --frozen --python "${{ matrix.python }}"

      - name: The suite, against nothing but the repository
        run: uv run pytest -q -p no:randomly

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --frozen --python "${PYTHON_VERSION}"

      - name: Coverage clears the gate in pyproject.toml
        run: uv run pytest -q -p no:randomly --cov --cov-report=term-missing

  library:
    name: The library needs nothing outside the standard library
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install it without the cli extra
        run: |
          python -m venv .bare
          .bare/bin/pip install --quiet --disable-pip-version-check .

      - name: The library imports and runs, and the command says how to get the cli extra
        run: |
          set -euo pipefail
          .bare/bin/python -c "from anypatch import doctor; assert doctor.diagnose().healthy"
          if .bare/bin/python -c "import typer" 2>/dev/null; then
            echo "::error title=Typer leaked::the library install pulled in typer"
            exit 1
          fi
          set +e
          message=$(.bare/bin/anypatch doctor 2>&1)
          code=$?
          set -e
          echo "${message}"
          if [[ ${code} != 1 || ${message} != *"cli extra"* ]]; then
            echo "::error title=No hint::without the extra the command must exit 1 and name the extra"
            exit 1
          fi

  installed:
    name: Installed on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, label: Linux x86_64 }
          - { os: ubuntu-24.04-arm, label: Linux arm64 }
          - { os: macos-15-intel, label: macOS Intel }
          - { os: macos-latest, label: macOS Apple silicon }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install it the way a user would, with the command line
        run: python -m pip install --disable-pip-version-check ".[cli]"

      - name: The command line runs and the installation is healthy
        run: |
          anypatch --version
          anypatch doctor
          anypatch doctor --json

  formula:
    name: Homebrew formula
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Style
        run: brew style Formula/anypatch.rb

      - name: Install it from a tarball built out of git, and run its test
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          git archive --format=tar.gz --prefix=anypatch/ -o "${work}/src.tar.gz" HEAD
          checksum=$(shasum -a 256 "${work}/src.tar.gz" | awk '{print $1}')
          brew tap-new gufranco/anypatch-ci --no-git
          tap=$(brew --repository gufranco/anypatch-ci)
          mkdir -p "${tap}/Formula"
          python3 - "${work}" "${checksum}" "${tap}/Formula/anypatch.rb" <<'PATCH'
          import re
          import sys
          from pathlib import Path

          work, checksum, target = sys.argv[1], sys.argv[2], Path(sys.argv[3])
          text = Path("Formula/anypatch.rb").read_text()
          text = re.sub(r'url "[^"]+"', f'url "file://{work}/src.tar.gz"', text, count=1)
          text = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{checksum}"', text, count=1)
          version = Path("src/anypatch/version.py").read_text().split('"')[1]
          text = text.replace('  license "MIT"', f'  version "{version}"\n  license "MIT"', 1)
          target.write_text(text)
          PATCH
          brew install --build-from-source gufranco/anypatch-ci/anypatch
          brew test gufranco/anypatch-ci/anypatch

  distribution:
    name: The wheel carries the library and nothing else
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build it
        run: uv build --wheel

      - name: No test or test support file ships
        run: |
          python3 - <<'CHECK'
          import sys
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          shipped = [name for name in names if name.endswith(("_test.py", "_test_support.py", "conftest.py"))]
          print(f"{len(names)} files in {wheel.name}")
          if shipped:
              print(f"::error title=Tests in the wheel::{', '.join(shipped)}")
              sys.exit(1)
          CHECK

  xdelta:
    name: xdelta3 and anypatch read each other's patches
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install anypatch and the reference tool
        run: |
          python -m pip install --disable-pip-version-check ".[cli]"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdelta3

      - name: Patches cross between anypatch and xdelta3 in both directions
        run: |
          python - <<'CHECK'
          import subprocess
          import sys
          from pathlib import Path

          source = bytes((at * 2654435761 >> 16) & 0xFF for at in range(300000))
          target = bytearray(source)
          target[1000:1010] = b"0123456789"
          target[200000:200040] = bytes(40)
          target = bytes(target) + b"appended tail" * 50
          Path("source.bin").write_bytes(source)
          Path("target.bin").write_bytes(target)

          def run(*args):
              done = subprocess.run(list(args), capture_output=True, text=True)
              print(f"$ {' '.join(args)}\n{done.stdout}{done.stderr}")
              if done.returncode != 0:
                  print(f"::error title={args[0]} failed::{' '.join(args)}")
                  sys.exit(1)

          def same(path, who):
              if Path(path).read_bytes() != target:
                  print(f"::error title=Wrong output::{who}")
                  sys.exit(1)

          run("anypatch", "make", "source.bin", "target.bin", "-o", "ours.xdelta")
          run("xdelta3", "-d", "-f", "-s", "source.bin", "ours.xdelta", "theirs-read.bin")
          same("theirs-read.bin", "xdelta3 misread anypatch's patch")
          for flags in (["-S", "none"], ["-S", "lzma"], ["-S", "djw9"], ["-S", "fgk"]):
              run("xdelta3", "-e", "-f", *flags, "-s", "source.bin", "target.bin", "theirs.xdelta")
              run("anypatch", "apply", "source.bin", "theirs.xdelta", "-o", "ours-read.bin")
              same("ours-read.bin", f"anypatch misread an xdelta3 {flags} patch")
          print("both tools read each other's patches")
          CHECK
        shell: bash

  romjs:
    name: RomPatcher.js, bsdiff and anypatch read each other's patches
    runs-on: ubuntu-26.04
    env:
      ROMJS_COMMIT: 3183884086825c3a57c72026234debcef1e2240c
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install anypatch and the reference tools
        run: |
          python -m pip install --disable-pip-version-check ".[cli]"
          sudo apt-get update -qq
          sudo apt-get install -y -qq bsdiff
          git clone --quiet --filter=blob:none https://github.com/marcrobledo/RomPatcher.js.git "$RUNNER_TEMP/romjs"
          git -C "$RUNNER_TEMP/romjs" checkout --quiet "$ROMJS_COMMIT"

      - name: Write the RomPatcher.js harness
        run: |
          cat > "$RUNNER_TEMP/romjs.js" <<'HARNESS'
          const fs = require('fs');
          const RomPatcher = require(process.env.ROMJS + '/rom-patcher-js/RomPatcher.js');
          const [cmd, a, b, c, d] = process.argv.slice(2);
          const save = (file, path) => fs.writeFileSync(path, Buffer.from(file._u8array.subarray(0, file.fileSize)));
          if (cmd === 'apply') {
            const patch = RomPatcher.parsePatchFile(new BinFile(b));
            if (!patch) { throw new Error('unknown patch'); }
            save(RomPatcher.applyPatch(new BinFile(a), patch, { requireValidation: true }), c);
          } else {
            save(RomPatcher.createPatch(new BinFile(a), new BinFile(b), c).export(), d);
          }
          HARNESS

      - name: Patches cross between anypatch and the references in both directions
        env:
          ROMJS: ${{ runner.temp }}/romjs
          HARNESS: ${{ runner.temp }}/romjs.js
        run: |
          python - <<'CHECK'
          import os
          import subprocess
          import sys
          from pathlib import Path

          body = bytes((at * 2654435761 >> 16) & 0xFF for at in range(200000))
          source = b"\x80\x37\x12\x40" + body
          target = bytearray(source)
          target[1000:1010] = b"0123456789"
          target[150000:150040] = bytes(40)
          target = bytes(target) + b"appended tail" * 50
          Path("source.bin").write_bytes(source)
          Path("target.bin").write_bytes(target)

          def run(*args):
              done = subprocess.run(list(args), capture_output=True, text=True)
              print(f"$ {' '.join(args)}\n{done.stdout}{done.stderr}")
              if done.returncode != 0:
                  print(f"::error title={args[0]} failed::{' '.join(args)}")
                  sys.exit(1)

          def same(path, who):
              if Path(path).read_bytes() != target:
                  print(f"::error title=Wrong output::{who}")
                  sys.exit(1)

          harness = os.environ["HARNESS"]
          for kind in ("ips", "ebp", "ups", "bps", "ppf", "aps", "rup"):
              run("anypatch", "make", "source.bin", "target.bin", "-o", f"ours.{kind}")
              run("node", harness, "apply", "source.bin", f"ours.{kind}", f"theirs-read.{kind}")
              same(f"theirs-read.{kind}", f"RomPatcher.js misread anypatch's {kind} patch")
              run("node", harness, "create", "source.bin", "target.bin", kind, f"theirs.{kind}")
              run("anypatch", "apply", "source.bin", f"theirs.{kind}", "-o", f"ours-read.{kind}")
              same(f"ours-read.{kind}", f"anypatch misread a RomPatcher.js {kind} patch")
          run("anypatch", "make", "source.bin", "target.bin", "-o", "ours.bdf")
          run("bspatch", "source.bin", "bspatch-read.bin", "ours.bdf")
          same("bspatch-read.bin", "bspatch misread anypatch's BDF patch")
          run("node", harness, "apply", "source.bin", "ours.bdf", "romjs-read.bdf")
          same("romjs-read.bdf", "RomPatcher.js misread anypatch's BDF patch")
          run("bsdiff", "source.bin", "target.bin", "theirs.bdf")
          run("anypatch", "apply", "source.bin", "theirs.bdf", "-o", "ours-read.bdf")
          same("ours-read.bdf", "anypatch misread a bsdiff patch")
          Path("same-size.bin").write_bytes(target[: len(source)])
          run("anypatch", "make", "source.bin", "same-size.bin", "-o", "ours.gba.aps", "--format", "aps-gba")
          run("node", harness, "apply", "source.bin", "ours.gba.aps", "romjs-read.gba")
          if Path("romjs-read.gba").read_bytes() != target[: len(source)]:
              print("::error title=Wrong output::RomPatcher.js misread anypatch's APS for GBA patch")
              sys.exit(1)
          print("every tool reads every other tool's patches")
          CHECK
        shell: bash
